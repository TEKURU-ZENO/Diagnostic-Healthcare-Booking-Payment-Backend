x-app-env: &app-env
  DEBUG: "True"
  SECRET_KEY: django-insecure-eve-assignment-dev-secret-key-change-in-production-12345
  ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
  DATABASE_URL: postgres://eve_user:eve_password@db:5432/eve_db
  WEBHOOK_SECRET: eve_test_webhook_secret_shared_key_2026
  MOCK_PAYMENTS_ENABLED: "True"

services:
  db:
    image: postgres:16-alpine
    container_name: eve_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eve_db
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: eve_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: eve_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    container_name: eve_worker
    restart: unless-stopped
    command: >
      sh -c "while true; do
               python manage.py expire_stale_bookings;
               python manage.py reconcile_payments;
               sleep 60;
             done"
    volumes:
      - .:/app
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:

